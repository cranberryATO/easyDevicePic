<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>easyDevicePic</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='14' height='26' rx='3' fill='%234f8cff'/%3E%3Crect x='11' y='6' width='10' height='20' rx='1' fill='%2314161a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="drop-overlay" hidden>
      <div class="drop-overlay__inner">Drop an image to map it onto the screen</div>
    </div>

    <div id="error" class="error" hidden></div>

    <aside class="panel">
      <h1 class="panel__title">easyDevicePic</h1>

      <section class="field">
        <label class="field__label" for="model">Device</label>
        <select id="model"></select>
      </section>

      <section class="field">
        <span class="field__label">Picture</span>
        <button id="pick" type="button" class="button">Choose image…</button>
        <input id="file" type="file" accept="image/*" hidden />
        <p class="hint">…or drag &amp; drop one anywhere on the page.</p>
      </section>

      <section class="field">
        <span class="field__label">Fit</span>
        <div class="segmented" id="fit" role="group" aria-label="Fit mode">
          <button type="button" data-fit="stretch" class="is-active">Stretch</button>
          <button type="button" data-fit="cover">Cover</button>
          <button type="button" data-fit="contain">Contain</button>
        </div>
      </section>

      <section class="field">
        <span class="field__label">Rotation</span>
        <div class="slider">
          <label for="rot-x">X</label>
          <input id="rot-x" type="range" min="-90" max="90" step="1" value="0" />
          <output id="rot-x-out">0°</output>
        </div>
        <div class="slider">
          <label for="rot-y">Y</label>
          <input id="rot-y" type="range" min="-180" max="180" step="1" value="0" />
          <output id="rot-y-out">0°</output>
        </div>
        <div class="slider">
          <label for="rot-z">Z</label>
          <input id="rot-z" type="range" min="-180" max="180" step="1" value="0" />
          <output id="rot-z-out">0°</output>
        </div>
        <button id="reset" type="button" class="button button--subtle">Reset rotation</button>
      </section>

      <button id="download" type="button" class="button button--primary">Download PNG</button>
      <p class="hint" id="export-size"></p>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
